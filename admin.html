<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin FAQ</title>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />

<style>
body {
    margin: 0;
    font-family: Inter;
    background: #f8fafc;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 30px;
}

.card {
    background: white;
    border: 1px solid #e2e8f0;
    padding: 20px;
    margin-bottom: 12px;
    border-radius: 12px;
}

textarea, input {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="container" id="admin"></div>

<script>

const TOKEN = "github_pat_xxx";
const OWNER = "monmonint";
const REPO = "FAQ";
const PATH = "faq.json";

function decodeBase64(str) {
    const bin = atob(str);
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
}

function encodeBase64(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = "";
    bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin);
}

async function load() {

    const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;

    const file = await fetch(url, {
        headers: { Authorization: `token ${TOKEN}` }
    }).then(r => r.json());

    const json = JSON.parse(decodeBase64(file.content));

    const container = document.getElementById("admin");
    container.innerHTML = "";

    json.forEach((q, i) => {

        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <b>${q.question}</b>

            <textarea id="a${i}">${q.answer === "en attente" ? "" : q.answer}</textarea>

            <input id="c${i}" value="${q.category || ""}" placeholder="categorie">

            <button onclick="save(${i})">Save</button>
        `;

        container.appendChild(div);
    });

    window.data = json;
    window.sha = file.sha;
}

async function save(i) {

    const url = `https://api.github.com/repos/monmonint/FAQ/contents/faq.json`;

    const file = await fetch(url, {
        headers: { Authorization: `token ${TOKEN}` }
    }).then(r => r.json());

    const json = JSON.parse(decodeBase64(file.content));

    json[i].answer = document.getElementById("a" + i).value;
    json[i].category = document.getElementById("c" + i).value;

    const updated = encodeBase64(JSON.stringify(json, null, 2));

    await fetch(url, {
        method: "PUT",
        headers: {
            Authorization: `token ${TOKEN}`,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            message: "update faq",
            content: updated,
            sha: file.sha,
            branch: "main"
        })
    });

    setTimeout(() => location.reload(), 1200);
}

load();

</script>

</body>
</html>
