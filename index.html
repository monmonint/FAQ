<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ du Serveur</title>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<style>
/* --- ton CSS inchangé --- */
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Inter, system-ui, Arial, sans-serif;
    background: #f8fafc;
    color: #0f172a;
}

header {
    background: white;
    border-bottom: 1px solid #e2e8f0;
    padding: 20px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 20;
}

.search-box {
    margin-top: 22px;
    display: flex;
    justify-content: center;
}

#search {
    width: 100%;
    max-width: 720px;
    padding: 14px 18px;
    border-radius: 12px;
    border: 1px solid #dbeafe;
}

.container { max-width: 1000px; margin: auto; padding: 32px 20px 80px; }

.faq-item {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    margin-bottom: 12px;
    overflow: hidden;
}

.question {
    padding: 18px;
    cursor: pointer;
    font-weight: 600;
}

.answer {
    display: none;
    padding: 18px;
    border-top: 1px solid #e2e8f0;
    color: #475569;
}

.ask-button {
    position: fixed;
    right: 24px;
    bottom: 24px;
    background: #1e293b;
    color: white;
    border: none;
    border-radius: 999px;
    padding: 16px 22px;
    cursor: pointer;
}

.admin-button {
    position: fixed;
    left: 24px;
    bottom: 24px;
    background: white;
    border: 1px solid #cbd5e1;
    border-radius: 999px;
    padding: 14px 20px;
    cursor: pointer;
}
</style>
</head>

<body>

<header>
    <h1>FAQ du Serveur</h1>

    <div class="search-box">
        <input id="search" placeholder="Rechercher une question...">
    </div>
</header>

<div class="container">
    <div id="pendingFaq"></div>
    <div id="answeredFaq"></div>
</div>

<button class="ask-button" id="openSidebar">+ Poser une question</button>
<button class="admin-button" onclick="goToAdmin()">Admin</button>

<script>

const PART1 = "github_pat_11BVBQR4Y0KUGzpGsTZmmk_QpEL1l8v";
const PART2 = "3xoRmAhmhF1BoQHEvNjKSB1CkDB6LxDWnng4HII5B5Zon62i1YP";
const TOKEN = PART1 + PART2;

const OWNER = "monmonint";
const REPO = "FAQ";
const PATH = "faq.json";
const BRANCH = "main";

let faqData = [];
const CACHE_BUSTER = Date.now();

/* ---------------- LOAD ---------------- */

async function loadFAQ() {
    const res = await fetch(`./faq.json?v=${Date.now()}`, {
        cache: "no-store"
    });

    faqData = await res.json();
    faqData.reverse();
    render(faqData);
}

/* ---------------- UTF8 SAFE ---------------- */

function decodeBase64(str) {
    const binary = atob(str);
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
}

function encodeBase64(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = "";
    bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin);
}

/* ---------------- RENDER ---------------- */

function render(data) {
    const pending = data.filter(i => i.answer === "en attente");
    const answered = data.filter(i => i.answer !== "en attente");

    renderSection(pending, "pendingFaq", true);
    renderSection(answered, "answeredFaq", false);
}

function renderSection(list, id, pending) {
    const container = document.getElementById(id);
    container.innerHTML = "";

    list.forEach(item => {
        const div = document.createElement("div");
        div.className = "faq-item";

        div.innerHTML = `
            <div class="question">${item.question}</div>
            <div class="answer" style="display:${pending ? "block" : "none"}">
                ${item.answer}
            </div>
        `;

        div.querySelector(".question").onclick = () => {
            const a = div.querySelector(".answer");
            a.style.display = a.style.display === "block" ? "none" : "block";
        };

        container.appendChild(div);
    });
}

/* ---------------- GITHUB UPDATE ---------------- */

async function addToGithub(question) {

    const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;

    const file = await fetch(url, {
        headers: { Authorization: `token ${TOKEN}` }
    }).then(r => r.json());

    const json = JSON.parse(decodeBase64(file.content));

    json.push({
        question,
        answer: "en attente",
        category: "Utilisateur"
    });

    const updated = encodeBase64(JSON.stringify(json, null, 2));

    await fetch(url, {
        method: "PUT",
        headers: {
            Authorization: `token ${TOKEN}`,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            message: "new question",
            content: updated,
            sha: file.sha,
            branch: BRANCH
        })
    });

    setTimeout(() => location.reload(), 1500);
}

/* ---------------- UI ---------------- */

function goToAdmin() {
    const pass = prompt("Mot de passe admin ?");
    if (pass === "bodric") {
        window.location.href = "admin.html";
    }
}

/* ---------------- INIT ---------------- */

loadFAQ();

</script>

</body>
</html>
